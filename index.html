<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>よみあげスタジオ</title>
<style>
:root{--bg:#f3f1ec;--panel:#fff;--ink:#1d2433;--sub:#667085;--line:#d9d5cb;--acc:#2b5fd9;--accInk:#fff;--err:#b42318}
@media (prefers-color-scheme:dark){:root{--bg:#14171f;--panel:#1d212c;--ink:#e8eaf0;--sub:#9aa3b5;--line:#2f3545;--acc:#7da2ff;--accInk:#0e1320;--err:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Hiragino Sans","Noto Sans JP",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:1.5rem;margin:0 0 4px;letter-spacing:.04em}
.lead{color:var(--sub);margin:0 0 22px;font-size:.92rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
label{display:block;font-size:.85rem;color:var(--sub);margin:14px 0 4px}
label:first-child{margin-top:0}
select,input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px}
textarea{min-height:150px;resize:vertical}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.row{display:flex;gap:12px}.row>div{flex:1}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:10px 16px}
button.main{background:var(--acc);color:var(--accInk);border-color:var(--acc);font-weight:600}
button:disabled{opacity:.5;cursor:wait}
.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
#status{min-height:1.6em;margin-top:12px;font-size:.9rem;color:var(--sub)}
#status.err{color:var(--err)}
audio{width:100%;margin-top:10px}
.note{font-size:.8rem;color:var(--sub);margin-top:16px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>よみあげスタジオ</h1>
<p class="lead">外部の音声合成サービスで読み上げます。端末の音声に依存しないので、どの環境でも同じ声です。</p>

<section class="panel">
  <label for="provider">音声サービス</label>
  <select id="provider">
    <option value="voicevox">VOICEVOX(日本語キャラ声)</option>
    <option value="se">StreamElements(Amazon Polly・日英など)</option>
    <option value="google">Google翻訳の音声(言語別)</option>
    <option value="tiktok">TikTok系(コミュニティAPI)</option>
  </select>

  <div class="row">
    <div><label for="voice">声</label><select id="voice"></select></div>
    <div><label for="rate">速さ <span id="rateV">1.0</span>x</label>
      <input id="rate" type="range" min="0.6" max="1.6" step="0.1" value="1"></div>
  </div>

  <label for="text">読み上げるテキスト</label>
  <textarea id="text" maxlength="3000">こんにちは。この声は外部のAPIで作られているので、どの端末で開いても同じように聞こえます。</textarea>

  <div class="actions">
    <button class="main" id="go">読み上げる</button>
    <a id="dl" hidden><button type="button">MP3を保存</button></a>
  </div>
  <div id="status" role="status"></div>
  <audio id="player" controls hidden></audio>
</section>

<p class="note">すべてAPIキー不要の公開サービスです。非公式・無料のものが多く、長文や連続利用は制限されたり、予告なく止まったりすることがあります。長い文章は自動で分割して順に再生します。VOICEVOXは「VOICEVOX:声の名前」のクレジット表記が必要です。</p>
</main>

<script>
const VOICES={
  voicevox:[[3,"ずんだもん"],[2,"四国めたん"],[8,"春日部つむぎ"],[9,"波音リツ"],[10,"雨晴はう"],[11,"玄野武宏"],[13,"青山龍星"],[14,"冥鳴ひまり"],[16,"九州そら"],[20,"もち子さん"]],
  se:[["Mizuki","Mizuki(日本語・女性)"],["Takumi","Takumi(日本語・男性)"],["Brian","Brian(英・男性)"],["Amy","Amy(英・女性)"],["Emma","Emma(英・女性)"],["Joanna","Joanna(米・女性)"],["Matthew","Matthew(米・男性)"],["Justin","Justin(米・少年)"],["Ivy","Ivy(米・少女)"],["Salli","Salli(米・女性)"]],
  google:[["ja","日本語"],["en","English"],["zh-CN","中文"],["ko","한국어"],["fr","Français"],["de","Deutsch"],["es","Español"]],
  tiktok:[["jp_001","日本語・女性1"],["jp_003","日本語・女性2"],["jp_005","日本語・女性3"],["jp_006","日本語・男性"],["en_us_001","英語・女性"],["en_us_006","英語・男性1"],["en_us_007","英語・男性2"],["en_uk_001","英(UK)・男性"],["en_au_001","英(豪)・女性"]]
};
const $=id=>document.getElementById(id);
const provider=$("provider"),voice=$("voice"),player=$("player"),dl=$("dl"),st=$("status"),go=$("go");

function fillVoices(){
  voice.innerHTML=VOICES[provider.value].map(([v,n])=>`<option value="${v}">${n}</option>`).join("");
}
provider.onchange=fillVoices;fillVoices();
$("rate").oninput=e=>{$("rateV").textContent=Number(e.target.value).toFixed(1)};

function say(msg,err){st.textContent=msg;st.className=err?"err":""}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function viaVoicevox(text){
  const url=`https://api.tts.quest/v3/voicevox/synthesis?speaker=${voice.value}&text=${encodeURIComponent(text)}`;
  const res=await fetch(url);
  if(!res.ok)throw new Error("VOICEVOX APIに接続できませんでした("+res.status+")");
  const d=await res.json();
  if(!d.success)throw new Error("VOICEVOX APIがエラーを返しました。文章を短くして再度お試しください。");
  for(let i=0;i<30;i++){
    const s=await (await fetch(d.audioStatusUrl)).json();
    if(s.isAudioError)throw new Error("音声の生成に失敗しました。");
    if(s.isAudioReady)return {src:d.mp3StreamingUrl,dl:d.mp3DownloadUrl};
    say("音声を生成中…");await sleep(1000);
  }
  throw new Error("生成に時間がかかりすぎました。文章を短くしてください。");
}

function chunk(t,n){
  const parts=t.split(/(?<=[。！？!?.\n])/),out=[];let cur="";
  for(let p of parts){
    while(p.length>n){if(cur){out.push(cur);cur=""}out.push(p.slice(0,n));p=p.slice(n)}
    if((cur+p).length>n){out.push(cur);cur=p}else cur+=p;
  }
  if(cur.trim())out.push(cur);
  return out.map(x=>x.trim()).filter(Boolean);
}

async function viaGet(urlOf,n){
  const srcs=[];
  for(const c of chunk($("text").value.trim(),n)){
    const u=urlOf(c);
    try{const r=await fetch(u);if(!r.ok)throw 0;srcs.push(URL.createObjectURL(await r.blob()))}
    catch(e){srcs.push(u)}
  }
  return {srcs};
}
const viaSE=()=>viaGet(c=>`https://api.streamelements.com/kappa/v2/speech?voice=${voice.value}&text=${encodeURIComponent(c)}`,300);
const viaGoogle=()=>viaGet(c=>`https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=${voice.value}&q=${encodeURIComponent(c)}`,180);

async function viaTikTok(){
  const srcs=[];
  for(const c of chunk($("text").value.trim(),200)){
    const res=await fetch("https://tiktok-tts.weilnet.workers.dev/api/generation",{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({text:c,voice:voice.value})});
    const d=await res.json().catch(()=>null);
    if(!res.ok||!d||!d.data)throw new Error("このAPIは現在使えないようです。別のサービスをお試しください。");
    const bin=atob(d.data),u8=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
    srcs.push(URL.createObjectURL(new Blob([u8],{type:"audio/mpeg"})));
  }
  return {srcs};
}

let queue=[],qi=0;
player.onended=()=>{if(qi<queue.length-1){qi++;player.src=queue[qi];player.play().catch(()=>{})}};
player.onplay=()=>{player.playbackRate=Number($("rate").value)};

go.onclick=async()=>{
  const text=$("text").value.trim();
  if(!text){say("テキストを入力してください。",true);return}
  go.disabled=true;dl.hidden=true;say("音声を生成中…");
  try{
    const f={voicevox:async()=>{const r=await viaVoicevox(text);return {srcs:[r.src],dl:r.dl}},se:viaSE,google:viaGoogle,tiktok:viaTikTok}[provider.value];
    const r=await f();
    queue=r.srcs;qi=0;player.src=queue[0];player.hidden=false;
    const d=r.dl||(queue.length===1&&queue[0].startsWith("blob:")?queue[0]:null);
    if(d){dl.href=d;dl.download="voice.mp3";dl.target="_blank";dl.hidden=false}
    await player.play().catch(()=>{});
    say("再生できます。");
  }catch(e){say(e.message||"エラーが発生しました。",true)}
  go.disabled=false;
};
</script>
</body>
</html>
